services:
  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-gateway
    restart: unless-stopped
    # read_only: true  # Deshabilitado para test local - en VPS usar tmpfs
    ports:
      - "127.0.0.1:18789:18789"  # Seguridad por defecto: solo localhost
    environment:
      - OPENCLAW_GATEWAY_MODE=local
      - OPENCLAW_GATEWAY_BIND=loopback
      - OPENCLAW_DISABLE_BONJOUR=1
    volumes:
      - ../data/.openclaw:/home/node/.openclaw
      - ../data/workspace:/home/node/.openclaw/workspace
      - tmp_data:/tmp/openclaw
    env_file:
      - ../config/.env
    networks:
      - openclaw-net
    healthcheck:
      test: ["CMD", "node", "dist/index.js", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  openclaw-cli:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-cli
    depends_on:
      - openclaw-gateway
    environment:
      - OPENCLAW_GATEWAY_URL=http://openclaw-gateway:18789
    env_file:
      - ../config/.env
    volumes:
      - ../data/.openclaw:/home/node/.openclaw
      - ../data/workspace:/home/node/.openclaw/workspace
    networks:
      - openclaw-net
    entrypoint: ["node", "dist/index.js"]
    # read_only: true  # Deshabilitado para test local

networks:
  openclaw-net:
    driver: bridge

volumes:
  tmp_data:
